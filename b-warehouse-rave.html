<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Endorfanize · Warehouse Rave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
a{color:#E4FF1A}a:hover{color:#F4FF9A}
</style>
<script src="render.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {
      acid: this.props.acid ?? '#E4FF1A',
      mixes: [
        { n: '01', title: 'Magik Gee N Rich Grant', style: 'House B2B', length: '3:00:01', url: 'https://www.mixcloud.com/magikgee/magik-gee-n-rich-grant/' },
        { n: '02', title: 'A Bass Journey', style: 'Bass', length: '1:12:56', url: 'https://www.mixcloud.com/magikgee/a-bass-journey/' },
        { n: '03', title: 'Get Filty n bounce', style: 'Tech house', length: '1:06:46', url: 'https://www.mixcloud.com/magikgee/get-filty-n-bounce/' },
        { n: '04', title: 'Magik Gee Tech n Bass', style: 'Tech / bass', length: '1:16:59', url: 'https://www.mixcloud.com/magikgee/' },
        { n: '05', title: '3 Beers & a Doobie', style: 'UKG / speed garage', length: '1:17:29', url: 'https://www.mixcloud.com/magikgee/' }
      ],
      past: [
        { date: '28.03.26', title: '80s Party launch', venue: 'The Beech Tree, St Mary Cray', detail: 'Monthly residency, last Saturday' },
        { date: '05.05.23', title: 'Love for Life London', venue: 'The Star by Liverpool Street', detail: 'Masquerade ball for Mind' },
        { date: '28.01.22', title: 'Epidemik Brighton Takeover 2', venue: 'Volks Club, Brighton', detail: 'The Bassment Bunker' },
        { date: '10.09.21', title: 'Epidemik Brighton Takeover', venue: 'Volks Club, Brighton', detail: 'Room 2 with MC Rookie D · warehouse anthems 88–90' }
      ],
      upcoming: [
        { date: '31.10', title: '80s PARTY — HALLOWEEN', venue: 'The Beech Tree, BR5 4AG', time: '8PM–LATE' },
        { date: '28.11', title: '80s PARTY', venue: 'The Beech Tree, BR5 4AG', time: '8PM–LATE' },
        { date: '26.12', title: '80s PARTY — BOXING DAY', venue: 'The Beech Tree, BR5 4AG', time: '8PM–LATE' }
      ]
    };
  }
}
</script>
</head>
<body>
<template id="dc-template">

<div style="background: #0A0A0A; color: #F2F0E9; font-family: 'Space Mono', monospace; min-height: 100vh">

  <div style="background: {{acid}}; color: #0A0A0A; font-weight: 700; font-size: 13px; text-align: center; padding: 8px 16px">DESIGN CONCEPT B · WAREHOUSE RAVE · NOT THE LIVE SITE</div>

  <header style="border-bottom: 2px solid #F2F0E9; padding: 18px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
    <span style="font-family: 'Archivo Black', sans-serif; font-size: 22px; letter-spacing: 0.02em">ENDORFANIZE</span>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 14px; font-weight: 700">
      <a href="#mixes" style="color: #F2F0E9; text-decoration: none">[ MIXES ]</a>
      <a href="#credits" style="color: #F2F0E9; text-decoration: none">[ PLAYED ]</a>
      <a href="#dates" style="color: #F2F0E9; text-decoration: none">[ DATES ]</a>
      <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="color: {{acid}}; text-decoration: none">[ BOOKINGS ]</a>
    </nav>
  </header>

  <section style="display: flex; flex-wrap: wrap; border-bottom: 2px solid #F2F0E9">
    <div style="flex: 999 1 560px; min-width: 0; padding: 56px 24px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
      <div style="font-size: 14px; font-weight: 700">KENT, UK — HOUSE / BASS / OLD SKOOL</div>
      <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 128px; line-height: 0.86; letter-spacing: -0.03em">MAGIK<br>GEE</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 520px">Warehouse anthems, bassline and tech house. Played Epidemik Brighton on a bill with DJ Rap, Logan-D and Ellis Dee.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 0">
        <a href="#mixes" style="background: {{acid}}; color: #0A0A0A; text-decoration: none; padding: 18px 28px; font-weight: 700; font-size: 16px; border: 2px solid {{acid}}">PLAY A MIX ▸</a>
        <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="color: #F2F0E9; text-decoration: none; padding: 18px 28px; font-weight: 700; font-size: 16px; border: 2px solid #F2F0E9">BOOKING ENQUIRY</a>
      </div>
    </div>
    <div style="flex: 1 1 420px; min-width: 0; min-height: 520px; border-left: 2px solid #F2F0E9">
      <img src="assets/photo-11.jpg" alt="Dancer by the speakers under club lights" style="width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.25); display: block">
    </div>
  </section>

  <div style="border-bottom: 2px solid #F2F0E9; padding: 14px 24px; overflow: hidden; white-space: nowrap; font-family: 'Archivo Black', sans-serif; font-size: 22px; color: {{acid}}">EPIDEMIK BRIGHTON ✦ LOVE FOR LIFE LONDON ✦ THE BEECH TREE ✦ EPIDEMIK PT 2 ✦ MIXCLOUD ✦ EPIDEMIK BRIGHTON ✦ LOVE FOR LIFE LONDON</div>

  <section id="mixes" style="padding: 80px 24px 0; max-width: 1280px; margin: 0 auto">
    <h2 style="margin: 0 0 32px; font-family: 'Archivo Black', sans-serif; font-size: 56px; letter-spacing: -0.02em">MIXES</h2>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{mixes}}" as="m" hint-placeholder-count="5">
        <a href="{{m.url}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 22px 0; border-top: 2px solid #F2F0E9; color: #F2F0E9; text-decoration: none">
          <span style="width: 40px; font-weight: 700; color: {{acid}}">{{m.n}}</span>
          <span style="flex: 1 1 280px; font-family: 'Archivo Black', sans-serif; font-size: 28px; text-transform: uppercase">{{m.title}}</span>
          <span style="width: 200px; font-size: 14px">{{m.style}}</span>
          <span style="width: 80px; font-size: 14px">{{m.length}}</span>
          <span style="font-weight: 700; color: {{acid}}">PLAY ▸</span>
        </a>
      </sc-for>
      <div style="border-top: 2px solid #F2F0E9"></div>
    </div>
  </section>

  <section id="credits" style="padding: 96px 24px 0; max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px">
    <div style="flex: 1 1 360px; min-width: 0">
      <h2 style="margin: 0 0 24px; font-family: 'Archivo Black', sans-serif; font-size: 56px; letter-spacing: -0.02em">PLAYED</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6">From Brighton warehouse nights to London charity balls and Kent pub residencies.</p>
      <img src="assets/photo-08.jpg" alt="Packed dance floor" style="margin-top: 32px; width: 100%; height: 320px; object-fit: cover; filter: grayscale(1) contrast(1.2)">
    </div>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <sc-for list="{{past}}" as="e" hint-placeholder-count="4">
        <div style="border-top: 2px solid #F2F0E9; padding: 22px 0; display: flex; flex-wrap: wrap; gap: 16px 32px">
          <span style="width: 130px; font-weight: 700; color: {{acid}}">{{e.date}}</span>
          <div style="flex: 1 1 300px; min-width: 0">
            <div style="font-family: 'Archivo Black', sans-serif; font-size: 22px; text-transform: uppercase">{{e.title}}</div>
            <div style="font-size: 14px; margin-top: 6px">{{e.venue}}</div>
            <div style="font-size: 14px; margin-top: 4px; color: #B9B6AC">{{e.detail}}</div>
          </div>
        </div>
      </sc-for>
      <div style="border-top: 2px solid #F2F0E9"></div>
    </div>
  </section>

  <section id="dates" style="padding: 96px 24px 0; max-width: 1280px; margin: 0 auto">
    <h2 style="margin: 0 0 24px; font-family: 'Archivo Black', sans-serif; font-size: 56px; letter-spacing: -0.02em">NEXT UP</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; border: 2px solid #F2F0E9">
      <sc-for list="{{upcoming}}" as="e" hint-placeholder-count="3">
        <div style="padding: 28px; border: 1px solid #F2F0E9; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Archivo Black', sans-serif; font-size: 44px; color: {{acid}}">{{e.date}}</span>
          <span style="font-weight: 700; font-size: 16px">{{e.title}}</span>
          <span style="font-size: 14px">{{e.venue}}</span>
          <span style="font-size: 13px; color: #B9B6AC">{{e.time}} · TO BE CONFIRMED</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding: 96px 24px 0; max-width: 1280px; margin: 0 auto">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px">
      <img src="assets/photo-02.jpg" alt="Dance floor and lighting rig" style="width: 100%; height: 240px; object-fit: cover; filter: grayscale(1) contrast(1.2)">
      <img src="assets/photo-01.jpg" alt="Crowd at the bar with the decks in front" style="width: 100%; height: 240px; object-fit: cover; filter: grayscale(1) contrast(1.2)">
      <img src="assets/photo-04.jpg" alt="Busy dance floor" style="width: 100%; height: 240px; object-fit: cover; filter: grayscale(1) contrast(1.2)">
      <img src="assets/photo-05.jpg" alt="Crowd under disco lights" style="width: 100%; height: 240px; object-fit: cover; filter: grayscale(1) contrast(1.2)">
    </div>
  </section>

  <section style="margin-top: 96px; background: {{acid}}; color: #0A0A0A; padding: 72px 24px">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px">
      <div style="flex: 1 1 520px; min-width: 0">
        <h2 style="margin: 0 0 16px; font-family: 'Archivo Black', sans-serif; font-size: 64px; line-height: 0.95; letter-spacing: -0.02em">PROMOTERS &amp; VENUES</h2>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 560px">Club nights, festivals, private parties. Sound and lighting available. Send the date, venue and set length.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; font-weight: 700; font-size: 17px">
        <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="color: #0A0A0A">endorfanizeentertainment@outlook.com</a>
        <span>WHATSAPP 07594 601259</span>
        <span>PRESS KIT [COMING SOON]</span>
      </div>
    </div>
  </section>

  <footer style="padding: 32px 24px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px">
    <span>ENDORFANIZE ENTERTAINMENT — "IT'S NICE TO BE IMPORTANT BUT IT'S MORE IMPORTANT TO BE NICE."</span>
    <div style="display: flex; flex-wrap: wrap; gap: 20px; font-weight: 700">
      <a href="https://www.mixcloud.com/magikgee/">MIXCLOUD</a>
      <a href="https://www.instagram.com/magik_gee92/">INSTAGRAM</a>
      <a href="https://www.tiktok.com/@endorfanize.enter">TIKTOK</a>
      <a href="https://www.facebook.com/share/1BKctca8y5/">FACEBOOK</a>
    </div>
  </footer>
</div>
</template>
</body>
</html>
