<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Endorfanize · Neon Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1020}
a{color:#3CC8F5}a:hover{color:#8EE3FF}
</style>
<script src="render.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#C42FD6',
      genres: ['House', 'Tech house', 'Bassline', 'UK garage', 'Jungle & DnB', 'Old-school rave', '60s to 90s classics'],
      mixes: [
        { title: 'Magik Gee N Rich Grant', style: 'HOUSE · B2B', length: '3 hr', url: 'https://www.mixcloud.com/magikgee/magik-gee-n-rich-grant/' },
        { title: 'A Bass Journey', style: 'BASS', length: '1 hr 13', url: 'https://www.mixcloud.com/magikgee/a-bass-journey/' },
        { title: 'Get Filty n bounce', style: 'TECH HOUSE', length: '1 hr 7', url: 'https://www.mixcloud.com/magikgee/get-filty-n-bounce/' }
      ],
      upcoming: [
        { day: '31', month: 'OCT', title: '80s Party · Halloween', venue: 'The Beech Tree, BR5 4AG', time: '8pm till late', badge: 'TBC' },
        { day: '28', month: 'NOV', title: '80s Party', venue: 'The Beech Tree, BR5 4AG', time: '8pm till late', badge: 'TBC' },
        { day: '26', month: 'DEC', title: '80s Party · Boxing Day', venue: 'The Beech Tree, BR5 4AG', time: '8pm till late', badge: 'TBC' }
      ],
      past: [
        { date: '28 Mar 2026', title: '80s Party launch', venue: 'The Beech Tree, St Mary Cray' },
        { date: '5 May 2023', title: 'Love for Life masquerade ball', venue: 'The Star by Liverpool Street' },
        { date: '28 Jan 2022', title: 'Epidemik Brighton Takeover 2', venue: 'Volks Club, Brighton' },
        { date: '10 Sep 2021', title: 'Epidemik Brighton Takeover', venue: 'Volks Club, Brighton' }
      ],
      services: [
        { title: 'Clubs and bars', text: 'High-energy house, bass and rave sets that keep the floor packed.' },
        { title: 'Private parties', text: 'Birthdays and celebrations, with clean or explicit versions to suit the crowd.' },
        { title: 'Festivals', text: 'Old-school and house sets built for big rooms and late nights.' },
        { title: 'Sound and lights', text: 'Full sound and lighting setup brought to your venue. [KIT DETAILS TBC]' }
      ]
    };
  }
}
</script>
</head>
<body>
<template id="dc-template">

<div style="background: #0B1020; color: #EEF1F8; font-family: 'Manrope', sans-serif; min-height: 100vh">

  <div style="background: #FF8A3D; color: #1A0B00; font-weight: 800; font-size: 13px; text-align: center; padding: 8px 16px; letter-spacing: 0.04em">DESIGN CONCEPT A · NEON NIGHT · NOT THE LIVE SITE</div>

  <header style="max-width: 1240px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
    <img src="assets/logo.jpg" alt="Endorfanize Entertainment" style="height: 56px; width: auto; border-radius: 8px">
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; font-weight: 600; font-size: 15px">
      <a href="#listen" style="color: #EEF1F8; text-decoration: none">Listen</a>
      <a href="#dates" style="color: #EEF1F8; text-decoration: none">Dates</a>
      <a href="#gallery" style="color: #EEF1F8; text-decoration: none">Gallery</a>
      <a href="#book" style="color: #EEF1F8; text-decoration: none">Services</a>
      <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 800">Book a date</a>
    </nav>
  </header>

  <section style="position: relative; overflow: hidden; border-radius: 28px; max-width: 1240px; margin: 8px auto 0; min-height: 620px; display: flex; align-items: flex-end">
    <img src="assets/photo-02.jpg" alt="A packed dance floor under coloured lights at the Endorfanize 80s night" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,16,32,0.15) 0%, rgba(11,16,32,0.92) 78%)"></div>
    <div style="position: relative; padding: 48px; max-width: 820px; display: flex; flex-direction: column; gap: 20px">
      <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.18em; color: #3CC8F5">MAGIK GEE · KENT DJ</div>
      <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em">We don't play music. We ignite the night.</h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.55; color: #D3D8E6; max-width: 620px">House, bass, old-school rave and party classics for clubs, private parties and festivals. Sound and lights included.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
        <a href="#listen" style="background: #3CC8F5; color: #04121C; text-decoration: none; padding: 16px 26px; border-radius: 999px; font-weight: 800; font-size: 16px">Listen to a mix</a>
        <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="border: 2px solid #EEF1F8; color: #EEF1F8; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 800; font-size: 16px">Check a date</a>
      </div>
    </div>
  </section>

  <div style="max-width: 1240px; margin: 32px auto 0; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 10px">
    <sc-for list="{{genres}}" as="g" hint-placeholder-count="7">
      <span style="border: 1px solid #2A3352; background: #121933; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px">{{g}}</span>
    </sc-for>
  </div>

  <section id="listen" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px 0">
    <h2 style="margin: 0 0 8px; font-family: 'Unbounded', sans-serif; font-size: 40px">Listen</h2>
    <p style="margin: 0 0 32px; color: #A9B1C7; font-size: 17px">Full sets from Magik Gee on Mixcloud.</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
      <sc-for list="{{mixes}}" as="m" hint-placeholder-count="3">
        <a href="{{m.url}}" style="display: flex; flex-direction: column; gap: 14px; background: #121933; border: 1px solid #2A3352; border-radius: 20px; padding: 24px; text-decoration: none; color: #EEF1F8">
          <div style="display: flex; align-items: center; gap: 14px">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#FFFFFF"></path></svg>
            </span>
            <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #3CC8F5">{{m.style}}</span>
          </div>
          <span style="font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.2">{{m.title}}</span>
          <span style="color: #A9B1C7; font-size: 15px">{{m.length}} · Play on Mixcloud</span>
        </a>
      </sc-for>
    </div>
  </section>

  <section id="dates" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
    <div style="flex: 999 1 560px; min-width: 0">
      <h2 style="margin: 0 0 24px; font-family: 'Unbounded', sans-serif; font-size: 40px">Coming up</h2>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{upcoming}}" as="e" hint-placeholder-count="3">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; background: #121933; border: 1px solid #2A3352; border-radius: 18px; padding: 20px 24px">
            <div style="width: 72px; text-align: center; flex-shrink: 0">
              <div style="font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 900; color: #FF8A3D">{{e.day}}</div>
              <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em">{{e.month}}</div>
            </div>
            <div style="flex: 1 1 220px; min-width: 0">
              <div style="font-weight: 800; font-size: 18px">{{e.title}}</div>
              <div style="color: #A9B1C7; font-size: 15px">{{e.venue}} · {{e.time}}</div>
            </div>
            <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 999px; border: 1px solid #FF8A3D; color: #FF8A3D">{{e.badge}}</span>
          </div>
        </sc-for>
      </div>
      <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="display: inline-block; margin-top: 20px; font-weight: 800">Want Magik Gee at your event? Email to check a date</a>
    </div>
    <div style="flex: 1 1 300px; min-width: 0">
      <h2 style="margin: 0 0 24px; font-family: 'Unbounded', sans-serif; font-size: 28px">Played</h2>
      <div style="display: flex; flex-direction: column; gap: 18px">
        <sc-for list="{{past}}" as="e" hint-placeholder-count="4">
          <div style="border-left: 0; padding: 0 0 18px; border-bottom: 1px solid #2A3352">
            <div style="font-size: 13px; color: #3CC8F5; font-weight: 800">{{e.date}}</div>
            <div style="font-weight: 800; font-size: 17px; margin-top: 4px">{{e.title}}</div>
            <div style="color: #A9B1C7; font-size: 15px">{{e.venue}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section id="gallery" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px 0">
    <h2 style="margin: 0 0 24px; font-family: 'Unbounded', sans-serif; font-size: 40px">The 80s night</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
      <img src="assets/photo-01.jpg" alt="Crowd at the bar with the DJ decks in front" style="width: 100%; height: 280px; object-fit: cover; border-radius: 16px">
      <img src="assets/photo-12.jpg" alt="Guest in an 80s costume T-shirt" style="width: 100%; height: 280px; object-fit: cover; border-radius: 16px">
      <img src="assets/photo-08.jpg" alt="Dancers under disco lights" style="width: 100%; height: 280px; object-fit: cover; border-radius: 16px">
      <img src="assets/photo-11.jpg" alt="Dancer in a neon wig by the speakers" style="width: 100%; height: 280px; object-fit: cover; border-radius: 16px">
      <img src="assets/photo-04.jpg" alt="Busy dance floor" style="width: 100%; height: 280px; object-fit: cover; border-radius: 16px">
      <img src="assets/poster.jpg" alt="Poster for the 80s Party at The Beech Tree" style="width: 100%; height: 280px; object-fit: cover; object-position: top; border-radius: 16px">
    </div>
  </section>

  <section id="book" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px 0">
    <h2 style="margin: 0 0 24px; font-family: 'Unbounded', sans-serif; font-size: 40px">What you get</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
      <sc-for list="{{services}}" as="s" hint-placeholder-count="4">
        <div style="background: #121933; border: 1px solid #2A3352; border-radius: 20px; padding: 24px">
          <div style="font-family: 'Unbounded', sans-serif; font-size: 19px; font-weight: 700; margin-bottom: 10px">{{s.title}}</div>
          <div style="color: #C2C9DA; font-size: 15px; line-height: 1.55">{{s.text}}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="max-width: 1240px; margin: 96px auto 0; padding: 0 24px">
    <div style="position: relative; overflow: hidden; border-radius: 28px; padding: 56px 48px; background: #151B3A">
      <img src="assets/logo-art.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.35">
      <div style="position: relative; display: flex; flex-direction: column; gap: 18px; max-width: 640px">
        <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 44px; line-height: 1.05">Make your night legendary.</h2>
        <p style="margin: 0; font-size: 18px; color: #D3D8E6">The 2026 diary is open. Tell us the date, venue and type of event.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a href="mailto:endorfanizeentertainment@outlook.com?subject=Booking%20enquiry" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 16px 26px; border-radius: 999px; font-weight: 800">endorfanizeentertainment@outlook.com</a>
          <span style="border: 2px solid #EEF1F8; padding: 14px 24px; border-radius: 999px; font-weight: 800">WhatsApp 07594 601259</span>
        </div>
      </div>
    </div>
  </section>

  <footer style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; color: #A9B1C7; font-size: 15px">
    <span>Endorfanize Entertainment · Magik Gee · Kent</span>
    <div style="display: flex; flex-wrap: wrap; gap: 20px">
      <a href="https://www.mixcloud.com/magikgee/">Mixcloud</a>
      <a href="https://www.instagram.com/magik_gee92/">Instagram</a>
      <a href="https://www.tiktok.com/@endorfanize.enter">TikTok</a>
      <a href="https://www.facebook.com/share/1BKctca8y5/">Facebook</a>
    </div>
  </footer>
</div>
</template>
</body>
</html>
